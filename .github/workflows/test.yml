name: 'Test'

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:run
        working-directory: apps/desktop

      - name: Type-check frontend
        run: npm run typecheck
        working-directory: apps/desktop

      - name: Build frontend
        run: npm run build
        working-directory: apps/desktop

      - name: Run backend tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  # Branch protection requires a check named "Build". This job reports one result
  # for the whole matrix, so the required check doesn't change when platforms do.
  build:
    name: Build
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job to pass
        if: needs.test.result != 'success'
        run: |
          echo "test matrix result: ${{ needs.test.result }}"
          exit 1
