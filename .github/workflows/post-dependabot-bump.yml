name: Bump Version on Dependabot Merge

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Serialize bumps so back-to-back Dependabot merges don't race on main.
concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump-version:
    # Run only when the push contains a Dependabot-authored commit (squash or merge).
    # The bump commit is authored by github-actions[bot], so it doesn't retrigger this job.
    if: contains(github.event.commits.*.author.name, 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN can't push past main's branch protection, and tags it pushes
      # don't trigger release.yml, so this job needs an admin PAT.
      - name: Require RELEASE_TOKEN
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Repository secret RELEASE_TOKEN is not set (admin PAT with Contents: read and write)."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Bump version
        id: bump
        run: node .github/scripts/bump-version.mjs

      - name: Commit, tag, and push
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git add package.json package-lock.json \
            apps/desktop/package.json \
            apps/desktop/src-tauri/tauri.conf.json \
            apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock
          git commit -m "chore(release): bump version to $NEW_VERSION"
          git tag "v$NEW_VERSION"
          # The tag push triggers release.yml.
          git push --atomic origin main "v$NEW_VERSION"
